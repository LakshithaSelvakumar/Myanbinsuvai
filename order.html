<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Food Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #acaf4c;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #a0a045;
        }
        nav {
            background-color: #333;
        }

        nav a {
            color: white;
            padding: 10px 10px;
            display: inline-block;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>
    <nav>
    <a href="index.html">Home</a>
    <a href="menu2.html">Menu</a>
    <a href="location2.html">Location</a>
    <a href="order.html">Order Here</a>
</nav>

    <div class="container">
        <h2>Food Order Form</h2><form>
        <label for=>Food Name</label>
        <input type="text"  placeholder="Enter food name" required />

        <label >No. of Items</label>
        <input type="number"  min="1" placeholder="Enter quantity" required />

        <label >Delivery Address</label>
        <textarea  rows="4" placeholder="Enter delivery address" required></textarea>
        
        <label> Phone No</label>
        <input type="tel" placeholder="Enter your number here" >

        <button type="submit">Book Now</button>
    </form>
</div>
<script>
    window.onload = function () {
        alert("THANK YOU FOR VISITING OUR PAGE!   And click OK to place your order...");
    };
</script>

</body>
</html>
